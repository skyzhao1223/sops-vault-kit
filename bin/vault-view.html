<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault · 凭据库</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#e6e9ef; --dim:#8b93a3;
    --accent:#5b9dff; --warn:#ffb020;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7f9; --panel:#fff; --line:#e3e6ec; --fg:#1a1d24; --dim:#6b7280; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
  header{position:sticky;top:0;z-index:9;background:var(--panel);border-bottom:1px solid var(--line);
         padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  h1{font-size:15px;margin:0;font-weight:600;white-space:nowrap}
  .banner{background:rgba(255,176,32,.12);border:1px solid rgba(255,176,32,.35);color:var(--warn);
          border-radius:8px;padding:6px 11px;font-size:12.5px}
  input[type=search]{background:var(--bg);border:1px solid var(--line);color:var(--fg);
          border-radius:8px;padding:7px 11px;font-size:13px;min-width:220px;outline:none}
  input[type=search]:focus{border-color:var(--accent)}
  button{background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:8px;
         padding:6px 11px;font-size:13px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  main{padding:16px 20px 70px;max-width:1500px;margin:0 auto}
  h2{font-size:13px;color:var(--dim);margin:22px 2px 10px;font-weight:600}
  h2 em{font-style:normal;opacity:.7}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;
        transition:.15s}
  .card:hover{border-color:var(--accent)}
  .ch{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
  .sys{font-weight:700;font-size:14.5px}
  .ch i{font-style:normal;font-size:11px;color:var(--dim);border:1px solid var(--line);
        border-radius:20px;padding:1px 8px}
  .fs{display:flex;flex-direction:column;gap:5px}
  .f{display:flex;align-items:center;gap:8px;min-height:26px}
  .f label{color:var(--dim);font-size:12px;min-width:106px;flex-shrink:0;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .v{font:12.5px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bg);
     border:1px solid var(--line);border-radius:6px;padding:2px 8px;cursor:pointer;
     word-break:break-all;flex:1}
  .v:hover{border-color:var(--accent)}
  .v.masked{color:var(--dim);letter-spacing:1px}
  a.v{color:var(--accent);text-decoration:none}
  a.v:hover{text-decoration:underline}
  .eye{padding:2px 7px;font-size:12px;flex-shrink:0}
  .note{margin-top:9px;font-size:12px;color:var(--dim);border-top:1px dashed var(--line);padding-top:7px}
  .totp .code{font:700 20px/1 ui-monospace,Menlo,monospace;color:var(--accent);letter-spacing:3px;
              cursor:pointer;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
  .totp .rem{font-size:11px;color:var(--dim);min-width:26px}
  .totp .bar{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
  .totp .bar::after{content:"";display:block;height:100%;background:var(--accent);width:var(--w,100%)}
  .empty{padding:40px;text-align:center;color:var(--dim)}
  #toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
         background:var(--fg);color:var(--bg);border-radius:10px;padding:9px 18px;font-size:13px;
         opacity:0;pointer-events:none;transition:.2s;z-index:99}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <h1>🔐 Vault</h1>
  <input type="search" id="q" placeholder="搜索系统 / 字段 / 值…" autocomplete="off">
  <button id="toggle">显示全部密码</button>
  <span class="banner">⚠️ 本页为<b>明文</b>（默认打码）。看完关标签页并执行 <code>vault clean</code></span>
</header>
<main>
  <div id="groups"></div>
  <div class="empty" id="empty" hidden>没有匹配的记录</div>
</main>
<div id="toast"></div>
<script>
const DATA = /*__DATA__*/{};
const SENSITIVE = /*__SENSITIVE__*/[];
const SEC = new Set(SENSITIVE);
const GROUP_ORDER = ['工作','服务','生活'];
const META = new Set(['env','owner']);
const FOOT = new Set(['note','remark']);
const LINKY = new Set(['url','endpoint','restapi','console','doc','callback_url','notify_url','redirect_uri']);
let revealAll = false;
const paintAll = [];

const main = document.getElementById('groups');
const toastEl = document.getElementById('toast');
let toastTimer;
function toast(m){ toastEl.textContent = m; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 1300); }

async function copyText(t, label){
  try { await navigator.clipboard.writeText(t); }
  catch(e){ const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a);
            a.select(); document.execCommand('copy'); a.remove(); }
  toast('✓ 已复制 ' + label);
}
const mask = v => '•'.repeat(Math.min((v||'').length || 8, 18));

/* ---- TOTP（浏览器内实时计算，种子不出页面） ---- */
const canTOTP = window.isSecureContext && !!(window.crypto && crypto.subtle);
const totpJobs = [], keyCache = {};
function b32(s){
  s = (s||'').toUpperCase().replace(/[^A-Z2-7]/g,'');
  const A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  let bits = 0, n = 0; const out = [];
  for (const c of s){ n = (n<<5) | A.indexOf(c); bits += 5;
    if (bits >= 8){ out.push((n >>> (bits-8)) & 255); bits -= 8; } }
  return new Uint8Array(out);
}
async function totpCode(seed){
  if (!keyCache[seed]) keyCache[seed] = await crypto.subtle.importKey(
    'raw', b32(seed), {name:'HMAC', hash:'SHA-1'}, false, ['sign']);
  const buf = new ArrayBuffer(8);
  new DataView(buf).setUint32(4, Math.floor(Date.now()/30000));
  const sig = new Uint8Array(await crypto.subtle.sign('HMAC', keyCache[seed], buf));
  const o = sig[19] & 0x0f;
  return String(((sig[o]&0x7f)<<24 | sig[o+1]<<16 | sig[o+2]<<8 | sig[o+3]) % 1000000).padStart(6,'0');
}
async function tick(){
  if (!totpJobs.length) return;
  const remain = 30 - Math.floor(Date.now()/1000) % 30;
  const win = Math.floor(Date.now()/30000);
  for (const j of totpJobs){
    j.bar.style.setProperty('--w', (remain/30*100)+'%');
    j.rem.textContent = remain + 's';
    if (j.win === win && j.done) continue;
    j.win = win;
    try { j.code.textContent = await totpCode(j.seed); j.done = true; }
    catch(e){ j.code.textContent = '错误'; }
  }
}

/* ---- 渲染 ---- */
function fieldRow(sys, k, v){
  const row = document.createElement('div'); row.className = 'f';
  const lab = document.createElement('label'); lab.textContent = k; lab.title = k; row.appendChild(lab);
  const secret = SEC.has(k);
  const val = document.createElement('span');
  val.className = 'v' + (secret ? ' sec' : '');
  const paint = () => {
    const show = !secret || revealAll || val._rev;
    val.textContent = show ? v : mask(v);
    val.classList.toggle('masked', !show);
  };
  paint(); if (secret) paintAll.push(paint);
  val.title = '点击复制';
  val.onclick = () => copyText(v, sys + ' · ' + k);
  row.appendChild(val);
  if (secret){
    const eye = document.createElement('button');
    eye.className = 'eye'; eye.textContent = '👁'; eye.title = '显示 / 隐藏';
    eye.onclick = () => { val._rev = !val._rev; paint(); };
    row.appendChild(eye);
  }
  return row;
}
const rank = k => LINKY.has(k) ? 0 : (SEC.has(k) ? 2 : 1);

function card(name, s){
  const c = document.createElement('div'); c.className = 'card';
  const g = name.includes('/') ? name.split('/')[0] : '';
  c.dataset.search = (name + ' ' + Object.entries(s).map(([k,v])=>k+' '+v).join(' ')).toLowerCase();
  const head = document.createElement('div'); head.className = 'ch';
  const t = document.createElement('span'); t.className = 'sys';
  t.textContent = g ? name.slice(g.length+1) : name; t.title = name;
  head.appendChild(t);
  for (const m of ['env','owner']) if (s[m]){ const i = document.createElement('i'); i.textContent = s[m]; head.appendChild(i); }
  c.appendChild(head);

  const fs = document.createElement('div'); fs.className = 'fs';
  const keys = Object.keys(s).filter(k => !META.has(k) && !FOOT.has(k) && s[k] !== '')
                 .sort((a,b) => rank(a)-rank(b) || a.localeCompare(b));
  for (const k of keys){
    const v = s[k];
    if (k === 'totp'){
      const row = document.createElement('div'); row.className = 'f totp';
      const lab = document.createElement('label'); lab.textContent = '动态码'; row.appendChild(lab);
      if (canTOTP){
        const code = document.createElement('span'); code.className = 'code'; code.textContent = '------';
        code.title = '点击复制'; code.onclick = () => copyText(code.textContent, name+' · 动态码');
        const rem = document.createElement('span'); rem.className = 'rem'; rem.textContent = '30s';
        const bar = document.createElement('span'); bar.className = 'bar';
        row.append(code, rem, bar);
        totpJobs.push({seed: v, code, rem, bar});
      } else {
        const sp = document.createElement('span'); sp.className = 'v masked';
        sp.textContent = '终端执行 vault totp'; row.appendChild(sp);
      }
      fs.appendChild(row);
      continue;
    }
    if (LINKY.has(k) && /^https?:\/\//.test(v)){
      const row = document.createElement('div'); row.className = 'f';
      const lab = document.createElement('label'); lab.textContent = k; lab.title = k; row.appendChild(lab);
      const a = document.createElement('a'); a.className = 'v'; a.href = v;
      a.target = '_blank'; a.rel = 'noreferrer'; a.textContent = v;
      row.appendChild(a);
      const cp = document.createElement('button'); cp.className = 'eye'; cp.textContent = '⧉'; cp.title = '复制链接';
      cp.onclick = e => { e.preventDefault(); copyText(v, name+' · '+k); };
      row.appendChild(cp); fs.appendChild(row);
      continue;
    }
    fs.appendChild(fieldRow(name, k, v));
  }
  c.appendChild(fs);
  const note = s.note || s.remark;
  if (note){ const n = document.createElement('div'); n.className = 'note'; n.textContent = note; c.appendChild(n); }
  return c;
}

function render(){
  const groups = {};
  for (const [name, s] of Object.entries(DATA)){
    const g = name.includes('/') ? name.split('/')[0] : '未分组';
    (groups[g] = groups[g] || []).push([name, s]);
  }
  const gnames = Object.keys(groups).sort((a,b) => {
    const ia = GROUP_ORDER.indexOf(a), ib = GROUP_ORDER.indexOf(b);
    return ((ia<0?99:ia) - (ib<0?99:ib)) || a.localeCompare(b,'zh');
  });
  for (const g of gnames){
    const sec = document.createElement('section'); sec.className = 'group';
    const h = document.createElement('h2');
    h.textContent = g + ' ';
    const em = document.createElement('em'); em.textContent = '(' + groups[g].length + ')';
    h.appendChild(em); sec.appendChild(h);
    const grid = document.createElement('div'); grid.className = 'grid';
    for (const [name, s] of groups[g].sort((a,b)=>a[0].localeCompare(b[0],'zh'))) grid.appendChild(card(name, s));
    sec.appendChild(grid); main.appendChild(sec);
  }
  if (canTOTP){ tick(); setInterval(tick, 1000); }
}

function filter(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  let shown = 0;
  for (const c of document.querySelectorAll('.card')){
    const hit = !q || c.dataset.search.includes(q);
    c.style.display = hit ? '' : 'none'; if (hit) shown++;
  }
  for (const s of document.querySelectorAll('.group')){
    const cards = [...s.querySelectorAll('.card')];
    const vis = cards.filter(c => c.style.display !== 'none').length;
    s.style.display = vis ? '' : 'none';
    s.querySelector('h2 em').textContent = q && vis !== cards.length ? `(${vis}/${cards.length})` : `(${cards.length})`;
  }
  document.getElementById('empty').hidden = shown !== 0;
}

document.getElementById('q').addEventListener('input', filter);
document.getElementById('toggle').addEventListener('click', e => {
  revealAll = !revealAll;
  e.target.classList.toggle('on', revealAll);
  e.target.textContent = revealAll ? '隐藏全部密码' : '显示全部密码';
  paintAll.forEach(f => f());
});
render();
</script>
</body>
</html>
